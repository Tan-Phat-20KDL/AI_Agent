name: ci

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]   # 3.10: mức tối thiểu trong pyproject; 3.12: như máy dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -q numpy trimesh pytest
      - run: python -m pytest -q
      - name: syntax check shell scripts
        run: for f in infra/*.sh infra/*/*.sh; do bash -n "$f"; done
